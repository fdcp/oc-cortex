# Phase 3 配置
# Qdrant 三集合向量存储 (tasks / chunks_summary / chunks_cleaned_text)

# 查询向量化指令 (为空时保持原始 query)
query_instruction_for_retrieval: "为这个句子生成表示以用于检索相关文章："

# Phase 2 输出
phase2:
  tasks_file: "./output/tasks.jsonl"
  chunk_summaries_file: "./output/chunks_summary_p2.jsonl"

# Phase 1 输出
phase1:
  chunks_file: "./output/chunks.jsonl"

# Embedding 模型 (稠密检索)
embedding:
  model: "BAAI/bge-small-zh-v1.5"
  dim: 512
  batch_size: 32
  device: "cpu"           # auto / cpu / mps / cuda  (MPS 有挂起风险, 暂用 cpu)
  offline_mode: true      # 默认离线模式，优先使用本地缓存，不联网检查更新
  cache_folder: null      # 模型缓存目录，null 使用默认值 ~/.cache/huggingface/hub/

# 稀疏检索
sparse:
  method: "bm25"                     # bm25 | bge_m3
  chunks_summary_method: "sparse"    # sparse | dense
  bge_m3_model: "BAAI/bge-m3"       # sparse_method=bge_m3 时使用的模型
  jieba_mode: "search"               # jieba 分词模式 (bm25 使用)
  bm25_params:
    k1: 1.5
    b: 0.75
  fuse_k: 60                         # RRF 融合参数 k (Reciprocal Rank Fusion)

# Qdrant
qdrant:
  path: "./qdrant_data"   # 本地文件持久化路径
  collections:
    tasks: "tasks"
    chunks_summary: "chunks_summary"
    chunks_cleaned_text: "chunks_cleaned_text"

# Reranker (Phase 4: 跨 session 搜索精排)
reranker:
  model: "Qwen/Qwen3-Reranker-0.6B"
  device: "mps"            # auto / cpu / mps / cuda
  instruction: "检索与该查询语义相关的文档"
  max_length: 8192
  batch_size: 4

# P4 query-side alias expansion (依赖 P5 输出的 KG, 仅扩展 sparse 路径)
# 默认关闭; 验证召回质量后再翻 enabled: true
alias_expansion:
  enabled: false
  kg_db_path: ""                # 空 → 自动解析 output/{kg_auto_mode}/knowledge_graph.db
  kg_auto_mode: "entity"        # kg_db_path 为空时, 走哪个 extraction_mode
  max_idf_tokens: 3             # POS 过滤后, 按 IDF 降序取 top-K 个 token 进行扩展
  idf_floor: 0.5                # 任何 token IDF < 此值直接跳过 (停用词兜底)
  min_token_chars: 2            # 安全过滤: 短于此长度的 token 不参与扩展
  pos_keep: ["n", "eng", "x"]   # jieba 词性白名单 (名词/英文/字符串)
  max_aliases_per_match: 2      # 每个 entity hit 最多取 2 个 term (canonical + 1 alias)
  max_total_extra_terms: 6      # 所有 hit 累计 extra term 上限
  case_sensitive: false         # KG 严格匹配是否大小写敏感 (false: insensitive)
  match_mode: "exact"           # "exact" (==) | "word_boundary" (REGEXP \b...\b)

logging:
  level: "INFO"
  file: "./logs/phase3.log"
