# Phase 5 配置: 知识图谱构建

# 输入: Phase 2 产出
phase2:
  tasks_file: "./output/tasks.jsonl"

# LLM (同 Phase 2, OpenCode Zen)
# 注意: api_key_env / base_url 已移除, 由 opencode_models.yaml 提供
llm:
  triple_model: "MiniMax-M3" #"nemotron-3-ultra-free"   # Triple Extraction 使用的模型
  entity_model: "MiniMax-M3"  #"hy3"  # Entity Extraction 使用的模型
  # 上面两个字段是运行时的实际值, KGBuilder.post_init() 会按 extraction_mode 选其中一个
  # 若某个字段缺失, 回退到 model 字段; 若 model 也缺, 默认 "deepseek-v4-flash-free"
  model: "hy3"         # 兜底默认值 (triple_model / entity_model 未配时)
  merge_model: "MiniMax-M3"              # 实体合并 (alignment), 走 MiniMax Token Plan 端点
                                      # 合并本质是 MERGE/KEEP 二分类, reasoning 模型 (如 hy3)
                                      # 用不上还会浪费 max_tokens, 用轻量模型更稳更快
  max_retries: 3
  content_retries: 2
  timeout: 120
  max_tokens: 6000          # 三元组抽取 max_tokens
  merge_max_tokens: 420   # 实体合并确认 max_tokens (单条)
                           # 注意: 此值需 ≥ 2000, 否则 reasoning 模型 (如 hy3) 会因预算不足
                           # 连 thinking 都放不下, 频繁返回空内容, 漏掉大量本该合并的实体对
  merge_batch_size: 20      # 批量合并确认: 每批发送的实体对数
  merge_batch_enable: false  # 是否启用批量合并确认 (false=逐条确认, 更稳定)
  concurrency: 1            # 并发线程数
  rate_limit_per_sec: 1.0   # 线程级速率限制, 多并发自动错开 (防 429 雪崩, Token Plan 推荐 1.0~2.0)

# OpenCode 模型池配置: 提供 base_url 和 api_key (通过 auth.json)
# 路径支持相对路径 (优先 CWD, 找不到再退到项目根) 或绝对路径
opencode_models:
  config_path: "config/opencode_models.yaml"

# Embedding (复用 Phase 3)
embedding:
  model: "BAAI/bge-small-zh-v1.5"
  dim: 512
  batch_size: 32
  device: "cpu"
  offline_mode: true
  cache_folder: null

# Qdrant (复用 Phase 3 存储, 新增 entities 集合)
qdrant:
  path: "./qdrant_data"
  entities_collection: "entities"

# 知识图谱
knowledge_graph:
  extraction_mode: "entity"       # "triple" (三元组) | "entity" (直接实体提取+倒排索引)
  entity_alignment_threshold: 0.92
  # 输出目录 (两种模式互不干扰)
  triple_output_dir: "./output/triple"    # triple 模式输出目录
  entity_output_dir: "./output/entity"    # entity 模式输出目录

# 可视化
visualization:
  backend: "pyvis"
  height: 800
  width: 1200
  physics_solver: "forceAtlas2Based"
  max_nodes: 500
  drop_isolated_nodes: false

# SQLite 持久化 (Phase 5 Extension)
sqlite:
  enabled: true
  # db_path 默认为 {output_dir}/knowledge_graph.db，无需手动指定
  # 如需覆盖，取消下行注释:
  # db_path: "./output/knowledge_graph.db"

# Graph-RAG 搜索 (Phase 5 Extension)
graph_rag:
  enabled: true
  bfs_depth: 1              # BFS 扩散深度 (1=一跳邻居, 2=二跳)
  max_expand_nodes: 30      # BFS 最大扩散节点数
  max_graph_tasks: 50       # 图谱扩散最多引入的 task 数
  graph_channel_weight: 0.3  # 图谱通道在外层 RRF 的权重 (1-graph_channel_weight 给向量)

logging:
  level: "INFO"
  file: "./logs/phase5.log"
