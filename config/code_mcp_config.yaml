# MCP Server 配置

server:
  db_path: "output/entity/knowledge_graph.db"
  tasks_file: "output/tasks.jsonl"

# 上下文注入参数（code_mcp_client.py 使用）
context:
  depth: 1                  # BFS 扩散深度
  max_tasks: 10             # 每个上下文最多注入 task 数
  max_entities: 3           # 最多对几个实体做图谱扩散

# =============================================================
# 各客户端 MCP 配置（复制到对应位置即可）
# =============================================================

# --- Claude Code ---
# 方法 1: 命令行添加
#   claude mcp add knowledge-graph python3 /path/to/code_mcp_server.py
# 方法 2: 手动编辑 ~/.claude/claude_desktop_config.json
