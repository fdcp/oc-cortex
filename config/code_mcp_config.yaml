#     "knowledge-graph": {
#       "command": "python3",
#       "args": ["/Users/zhaoxiuwei/Desktop/oc_sess_graph/code_mcp_server.py"],
#       "env": {
#         "OPENCODE_ZEN_API_KEY": "<your-key>"
#       }
#     }
#   }

