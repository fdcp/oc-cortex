# Phase 3 配置
# Qdrant 双集合向量存储

# Phase 2 输出
phase2:
  tasks_file: "./output/tasks.jsonl"
  chunk_summaries_file: "./output/chunks_summary_p2.jsonl"

# Phase 1 输出
phase1:
  chunks_file: "./output/chunks.jsonl"

# Embedding 模型 (稠密检索)
embedding:
  model: "BAAI/bge-small-zh-v1.5"
  dim: 512
  batch_size: 32
  device: "cpu"           # auto / cpu / mps / cuda  (MPS 有挂起风险, 暂用 cpu)
  offline_mode: true      # 默认离线模式，优先使用本地缓存，不联网检查更新
  cache_folder: null      # 模型缓存目录，null 使用默认值 ~/.cache/huggingface/hub/

# 稀疏检索
sparse:
  method: "bm25"                     # bm25 | bge_m3
  bge_m3_model: "BAAI/bge-m3"       # sparse_method=bge_m3 时使用的模型
  jieba_mode: "search"               # jieba 分词模式 (bm25 使用)
  bm25_params:
    k1: 1.5
    b: 0.75
  fuse_k: 60                         # RRF 融合参数 k (Reciprocal Rank Fusion)

# Qdrant
qdrant:
  path: "./qdrant_data"   # 本地文件持久化路径
  collections:
    tasks: "tasks"
    chunks: "chunks"

# Reranker (Phase 4: 跨 session 搜索精排)
reranker:
  model: "Qwen/Qwen3-Reranker-0.6B"
  device: "cpu"            # auto / cpu / mps / cuda
  instruction: "Given a web search query, retrieve relevant passages."
  max_length: 8192
  batch_size: 4

logging:
  level: "INFO"
  file: "./logs/phase3.log"
