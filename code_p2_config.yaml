# Phase 2 配置
# Task 清单生成 (LLM 调用)

project:
  data_dir: "./data"
  output_dir: "./output"

# Phase 1 输出 (Phase 2 的输入)
phase1:
  chunks_file: "./output/chunks.jsonl"

# Phase 2 输出
output:
  chunk_summaries: "./output/chunks_summary_p2.jsonl"  # chunk 总结 (chunk_id + summary)

# LLM 配置 (OpenCode Zen - DeepSeek V4 Flash Free)
llm:
  provider: "opencode_zen"
  model: "deepseek-v4-flash-free"             # 免费模型
  api_key_env: "OPENCODE_ZEN_API_KEY"         # 环境变量名
  base_url: "https://opencode.ai/zen/v1"      # OpenCode Zen OpenAI 兼容端点
  max_retries: 3                              # LLM 调用最大重试次数
  timeout: 120                                # 单次请求超时(秒)
  temperature: 0.2                            # 生成温度 (低=更确定)
  max_tokens_per_chunk: 2000                  # 单个 chunk 在 prompt 中的最大 token 数
  max_total_prompt_tokens: 30000              # 整个 prompt 最大 token 数
  concurrency: 4                              # 并发线程数 (1=串行, >1=线程池并行)

logging:
  level: "INFO"                               # DEBUG / INFO / WARNING / ERROR
  file: "./logs/phase2.log"
